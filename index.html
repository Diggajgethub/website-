<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Website Finder (SWF)</title>
<meta name="description" content="Find hard-to-find and discontinued items from verified, trusted websites.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f1;
    --surface: #ffffff;
    --ink: #17212b;
    --muted: #5b6770;
    --line: #d9ddd3;
    --brand: #1d5c58;
    --brand-dark: #144542;
    --verified: #2b7a4b;
    --verified-bg: #e4f1e8;
    --warn: #a15c00;
    --warn-bg: #fbeed4;
    --danger: #a3262a;
    --focus: #0b63ce;
    --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12181d;
      --surface: #1b242b;
      --ink: #e8ecea;
      --muted: #9aa7ae;
      --line: #2e3a42;
      --brand: #5fb8b1;
      --brand-dark: #7fd0c9;
      --verified: #6fd391;
      --verified-bg: #1c3527;
      --warn: #f0b64d;
      --warn-bg: #3a2d12;
      --danger: #ff8a8d;
      --focus: #7ab4ff;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 80px; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--body); font-size: 16px; line-height: 1.55;
  }
  h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
  a { color: var(--brand); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  button, input, textarea, select { font: inherit; color: inherit; }

  /* Header */
  .topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .topbar-inner { max-width: 1100px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); margin-right: auto; }
  .brand-mark { width: 34px; height: 34px; flex: none; }
  .brand-name { font-family: var(--display); font-weight: 700; font-size: 1.25rem; }
  .brand-name small { font-family: var(--body); font-weight: 500; color: var(--muted); font-size: .8rem; margin-left: 6px; }
  .who { color: var(--muted); font-size: .9rem; }
  .role-tag { background: var(--warn-bg); color: var(--warn); border-radius: 4px; padding: 1px 7px; font-size: .8rem; font-weight: 600; margin-left: 6px; }

  /* Buttons */
  .btn { border: 1.5px solid var(--brand); background: var(--brand); color: #fff; border-radius: 8px; padding: 9px 16px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
  @media (prefers-color-scheme: dark) { .btn { color: #0c1a19; } }
  .btn.ghost { background: transparent; color: var(--brand); }
  .btn.ghost:hover { background: var(--verified-bg); }
  .btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  .btn.small { padding: 5px 11px; font-size: .88rem; }

  main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }

  /* Home hero + search */
  .hero { padding: 18px 0 8px; }
  .hero h1 { font-size: clamp(1.9rem, 4.5vw, 2.9rem); max-width: 18ch; }
  .hero p { color: var(--muted); max-width: 56ch; margin: 12px 0 0; }
  .searchbar { display: flex; gap: 8px; margin: 24px 0 8px; max-width: 680px; }
  .searchbar input { flex: 1; min-width: 0; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); }
  .searchbar input:focus { border-color: var(--brand); }
  .count { color: var(--muted); font-size: .92rem; margin: 6px 0 18px; }

  /* Grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .card-open { all: unset; cursor: pointer; display: block; }
  .card-open:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
  .thumb { aspect-ratio: 4 / 3; background: var(--verified-bg); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .ph { font-size: 3rem; }
  .seal { position: absolute; right: 8px; top: 8px; background: var(--surface); color: var(--verified); border: 1.5px solid var(--verified); border-radius: 999px; padding: 2px 9px 2px 6px; font-size: .78rem; font-weight: 600; display: flex; gap: 4px; align-items: center; }
  .card-body { padding: 12px 14px 14px; }
  .card-body h3 { font-size: 1.05rem; }
  .card-body .site { color: var(--muted); font-size: .88rem; margin-top: 3px; overflow-wrap: anywhere; }
  .card-admin { border-top: 1px solid var(--line); padding: 8px 14px; display: flex; gap: 8px; }
  .add-card { border: 2px dashed var(--brand); background: transparent; color: var(--brand); border-radius: 10px; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-weight: 600; }
  .add-card span { font-size: 2.2rem; line-height: 1; }
  .add-card:hover { background: var(--verified-bg); }
  .empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 32px; text-align: center; color: var(--muted); }

  /* Detail */
  .back { display: inline-block; margin-bottom: 16px; }
  .detail { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 28px; }
  @media (max-width: 720px) { .detail { grid-template-columns: 1fr; padding: 16px; } }
  .detail .thumb { border-radius: 10px; aspect-ratio: 1 / 1; border: 1px solid var(--line); }
  .detail h1 { font-size: clamp(1.6rem, 3.5vw, 2.2rem); }
  .field { margin-top: 18px; }
  .field .label { font-size: .85rem; color: var(--muted); margin-bottom: 2px; }
  .field .value { font-size: 1.1rem; font-weight: 600; overflow-wrap: anywhere; }
  .field .reason { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; white-space: pre-wrap; }
  .verified-line { display: inline-flex; gap: 6px; align-items: center; background: var(--verified-bg); color: var(--verified); border-radius: 6px; padding: 3px 10px; font-size: .88rem; font-weight: 600; margin-top: 10px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; }
  .notice { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 14px; font-size: .92rem; margin-top: 18px; }

  /* Item ratings and comments */
  .reviews { margin-top: 24px; padding: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .reviews h2 { font-size: 1.5rem; }
  .review-summary { margin: 12px 0; font-weight: 600; }
  .stars { color: var(--warn); letter-spacing: 3px; }
  .rating-picker { border: 0; padding: 0; margin: 18px 0; }
  .rating-picker legend { font-weight: 600; }
  .star-options { display: flex; flex-wrap: wrap; gap: 8px; }
  .star-options label { cursor: pointer; display: inline-flex; align-items: center; gap: 4px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; }
  .star-options label:has(input:checked) { background: var(--warn-bg); border-color: var(--warn); }
  .review-entry { border-top: 1px solid var(--line); padding: 18px 0; }
  .review-entry p { white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 0; }
  .review-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .review-meta time { color: var(--muted); font-size: .85rem; }
  @media (max-width: 720px) { .reviews { padding: 16px; } }

  /* Forms */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 26px; max-width: 480px; margin: 20px auto; }
  .panel.wide { max-width: 720px; }
  .panel h1 { font-size: 1.7rem; margin-bottom: 6px; }
  .panel p.sub { color: var(--muted); margin: 0 0 18px; }
  label { display: block; font-weight: 600; font-size: .92rem; margin: 14px 0 4px; }
  .input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg); }
  .input:focus { border-color: var(--brand); }
  textarea.input { min-height: 110px; resize: vertical; }
  .hint { color: var(--muted); font-size: .85rem; margin-top: 4px; }
  .error { color: var(--danger); font-size: .92rem; margin-top: 12px; min-height: 1.2em; }
  .row { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .preview { margin-top: 10px; max-width: 180px; border-radius: 8px; border: 1px solid var(--line); display: none; }

  footer { max-width: 1100px; margin: 0 auto; padding: 0 20px 40px; color: var(--muted); font-size: .85rem; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 8px; font-weight: 500; z-index: 20; }
  @media (prefers-reduced-motion: no-preference) { .toast { animation: pop .18s ease-out; } @keyframes pop { from { opacity: 0; transform: translate(-50%, 8px); } } }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/" aria-label="Secure Website Finder home">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M20 3 33 8v10c0 9-5.6 16.2-13 19C12.6 34.2 7 27 7 18V8z" fill="var(--brand)"/>
        <path d="m13.5 19.5 4.6 4.6 8.6-9.2" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">Secure Website Finder<small>SWF</small></span>
    </a>
    <span class="who" id="who"></span>
    <button class="btn ghost" id="authBtn" type="button">Login</button>
  </div>
</header>

<main id="app"></main>
<footer>SWF lists websites we have checked. Always review a site yourself before you pay.</footer>
<div id="toastHost" aria-live="polite"></div>

<script>
/* AWS configuration: public application identifiers, no secret keys. */
const CONFIG = {
  api: "https://l8pef0irs3.execute-api.us-east-2.amazonaws.com",
  domain: "https://us-east-22qeuflen8.auth.us-east-2.amazoncognito.com",
  clientId: "7enbdneosgfua20ourlv2i046f",
  issuer: "https://cognito-idp.us-east-2.amazonaws.com/us-east-2_2qeUFleN8",
  redirect: "https://d30v3zepxqi0h5.cloudfront.net/"
};
const TOKEN_KEY = "swf_cognito_tokens_v1";
let itemCache = [], authTokens = null;
const base64url = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
function tokenClaims(token) {
  const part = token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(part.padEnd(Math.ceil(part.length/4)*4,"=")), c => c.charCodeAt(0))));
}
function clearAuth() { authTokens = null; sessionStorage.removeItem(TOKEN_KEY); }
function getSession() {
  try {
    if (!authTokens) authTokens = JSON.parse(sessionStorage.getItem(TOKEN_KEY) || "null");
    if (!authTokens?.id_token) return null;
    const claims = tokenClaims(authTokens.id_token);
    if (claims.exp * 1000 <= Date.now() || claims.iss !== CONFIG.issuer || claims.aud !== CONFIG.clientId) { clearAuth(); return null; }
    return {username:claims["cognito:username"] || "Member", role:(claims["cognito:groups"] || []).includes("Admins") ? "admin" : "user"};
  } catch (e) { authTokens = null; return null; }
}
async function startLogin(register=false) {
  const random = () => base64url(crypto.getRandomValues(new Uint8Array(32)));
  const verifier = random(), state = random(), nonce = random();
  const challenge = base64url(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier))));
  sessionStorage.setItem("swf_login", JSON.stringify({verifier,state,nonce,returnHash:location.hash.startsWith("#/item/") ? location.hash : "#/",time:Date.now()}));
  const params = new URLSearchParams({client_id:CONFIG.clientId,redirect_uri:CONFIG.redirect,response_type:"code",scope:"openid email",state,nonce,code_challenge:challenge,code_challenge_method:"S256"});
  location.assign(CONFIG.domain + (register ? "/signup?" : "/oauth2/authorize?") + params);
}
async function finishLogin() {
  const params = new URLSearchParams(location.search);
  if (!params.has("code") && !params.has("error")) return;
  const pending = JSON.parse(sessionStorage.getItem("swf_login") || "null");
  history.replaceState(null,"",location.pathname + "#/");
  sessionStorage.removeItem("swf_login");
  if (!pending || params.get("state") !== pending.state || Date.now()-pending.time > 900000) throw new Error("Login expired or could not be verified. Please log in again.");
  if (params.has("error")) throw new Error("Login was cancelled or denied. Please try again.");
  const res = await fetch(CONFIG.domain + "/oauth2/token", {method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({grant_type:"authorization_code",client_id:CONFIG.clientId,code:params.get("code"),redirect_uri:CONFIG.redirect,code_verifier:pending.verifier})});
  if (!res.ok) throw new Error("Could not finish login. Please try again.");
  const tokens = await res.json();
  const claims = tokenClaims(tokens.id_token);
  if (claims.nonce !== pending.nonce || claims.iss !== CONFIG.issuer || claims.aud !== CONFIG.clientId || claims.exp*1000 <= Date.now()) throw new Error("Login response could not be verified.");
  authTokens = {id_token:tokens.id_token};
  sessionStorage.setItem(TOKEN_KEY, JSON.stringify(authTokens));
  history.replaceState(null,"",location.pathname + pending.returnHash);
}
async function api(path, method="GET", data) {
  const headers = {};
  if (method !== "GET") {
    if (!getSession()) throw new Error("Your session expired. Log in again before saving.");
    // API Gateway verifies the ID token's signature, issuer, audience and expiry.
    headers.Authorization = "Bearer " + authTokens.id_token;
    headers["Content-Type"] = "application/json";
  }
  let res;
  try { res = await fetch(CONFIG.api + path,{method,headers,cache:"no-store",...(data === undefined ? {} : {body:JSON.stringify(data)})}); }
  catch (e) { throw new Error("Could not reach the server. Check your connection and try again."); }
  const result = await res.json().catch(() => ({}));
  if (res.status === 401) { clearAuth(); renderHeader(); }
  if (!res.ok) throw new Error(result.message || "Request failed. Please try again.");
  return result;
}
const store = {
  session:getSession,
  items:() => itemCache,
  reviews:async id => (await api("/items/" + encodeURIComponent(id) + "/reviews")).reviews,
  addReview:review => api("/items/" + encodeURIComponent(review.itemId) + "/reviews","POST",{rating:review.rating,comment:review.comment})
};

/* ---- Helpers ---- */
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isAdmin = () => (store.session() || {}).role === "admin";
function safeUrl(u) {
  try { const x = new URL(u); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : ""; } catch (e) { return ""; }
}
function toast(msg) {
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg;
  document.getElementById("toastHost").appendChild(el); setTimeout(() => el.remove(), 2600);
}
const SEAL = '<svg width="14" height="14" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="currentColor"/><path d="m5.8 10.3 3 3 5.4-6" fill="none" stroke="var(--surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function thumb(item, seal) {
  const img = safeUrl(item.image) || (item.image || "").startsWith("data:image/") ? item.image : "";
  const inner = img ? `<img src="${esc(img)}" alt="${esc(item.name)}">` : `<span class="ph" aria-hidden="true">${esc(item.emoji || "📦")}</span>`;
  return `<div class="thumb">${inner}${seal ? `<span class="seal">${SEAL} Verified</span>` : ""}</div>`;
}
function newId() { return "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* ---- Header ---- */
function renderHeader() {
  const s = store.session();
  document.getElementById("who").innerHTML = s ? `${esc(s.username)}${s.role === "admin" ? '<span class="role-tag">Admin</span>' : ""}` : "";
  document.getElementById("authBtn").textContent = s ? "Logout" : "Login";
}
document.getElementById("authBtn").addEventListener("click", () => {
  if (store.session()) {
    clearAuth();
    location.assign(CONFIG.domain + "/logout?" + new URLSearchParams({client_id:CONFIG.clientId,logout_uri:CONFIG.redirect}));
  } else location.hash = "#/login";
});

/* ---- Views ---- */
let query = "";

function viewHome() {
  const admin = isAdmin();
  $app.innerHTML = `
    <section class="hero">
      <h1>Find the item. Skip the scam.</h1>
      <p>Search for hard-to-find or discontinued items. Every site in our database has been checked, so you can buy without guessing who to trust.</p>
      <form class="searchbar" role="search" id="searchForm">
        <input id="q" type="search" placeholder="Search for an item, like “Charizard”" aria-label="Search items" value="${esc(query)}">
        <button class="btn" type="submit">Search</button>
      </form>
      <div class="count" id="count"></div>
    </section>
    <section class="grid" id="grid" aria-label="Items"></section>`;
  document.getElementById("searchForm").addEventListener("submit", e => {
    e.preventDefault(); query = document.getElementById("q").value.trim(); drawGrid();
  });
  drawGrid();
}

function drawGrid() {
  const admin = isAdmin();
  const q = query.toLowerCase();
  const all = store.items();
  const list = !q ? all : all.filter(i => [i.name, i.category, i.siteName, i.reason].some(f => (f || "").toLowerCase().includes(q)));
  document.getElementById("count").textContent = q
    ? `${list.length} result${list.length === 1 ? "" : "s"} for “${query}”`
    : `${all.length} verified listing${all.length === 1 ? "" : "s"}`;
  const grid = document.getElementById("grid");
  if (!list.length && !admin) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><strong>No match yet.</strong><br>That item isn't in our database. Try a different name or a broader word.</div>`;
    return;
  }
  grid.innerHTML = list.map(i => `
    <article class="card">
      <a class="card-open" href="#/item/${esc(i.id)}" aria-label="Open ${esc(i.name)}">
        ${thumb(i, true)}
        <div class="card-body"><h3>${esc(i.name)}</h3><div class="site">${esc(i.siteName)}</div></div>
      </a>
      ${admin ? `<div class="card-admin"><a class="btn ghost small" href="#/edit/${esc(i.id)}">Edit</a><button class="btn danger small" data-del="${esc(i.id)}" type="button">Delete</button></div>` : ""}
    </article>`).join("") +
    (admin ? `<a class="add-card" href="#/edit/new"><span>+</span>Add item</a>` : "");
  grid.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
    const item = store.items().find(x => x.id === b.dataset.del);
    if (item && confirm(`Delete “${item.name}”?`)) {
      b.disabled = true;
      try {
        await api("/items/" + encodeURIComponent(item.id), "DELETE");
        itemCache = itemCache.filter(x => x.id !== item.id);
        toast("Item deleted"); drawGrid();
      } catch (e) { toast(e.message); b.disabled = false; }
    }
  }));
}

function viewItem(id) {
  const i = store.items().find(x => x.id === id);
  if (!i) { $app.innerHTML = `<div class="empty">That item no longer exists. <a href="#/">Back to search</a></div>`; return; }
  const url = safeUrl(i.siteUrl);
  $app.innerHTML = `
    <a class="back" href="#/">← Back to search</a>
    <article class="detail">
      ${thumb(i, false)}
      <div>
        <h1>${esc(i.name)}</h1>
        <div class="verified-line">${SEAL} Verified website</div>
        <div class="field"><div class="label">Website name</div><div class="value">${esc(i.siteName)}</div></div>
        <div class="field"><div class="label">Website link</div>
          <div class="value">${url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer nofollow">${esc(url)}</a>` : "No link available"}</div></div>
        <div class="field"><div class="label">Why we trust it</div><div class="reason">${esc(i.reason)}</div></div>
        <div class="actions">
          ${url ? `<a class="btn" href="${esc(url)}" target="_blank" rel="noopener noreferrer nofollow">Visit website</a>` : ""}
          ${isAdmin() ? `<a class="btn ghost" href="#/edit/${esc(i.id)}">Edit this page</a>` : ""}
        </div>
      </div>
    </article>
    <section class="reviews" aria-labelledby="reviewsTitle" id="reviews"></section>`;
  renderReviews(id);
}

/* Shared reviews loaded from AWS. */
async function renderReviews(itemId) {
  const host = document.getElementById("reviews");
  const session = store.session();
  let reviews = [], loadFailed = false;
  try { reviews = await store.reviews(itemId); }
  catch (e) { loadFailed = true; }
  if (!host.isConnected) return;
  const average = reviews.length ? (reviews.reduce((sum, r) => sum + r.rating, 0) / reviews.length).toFixed(1) : null;
  host.innerHTML = `
    <h2 id="reviewsTitle">Ratings &amp; comments</h2>
    <div class="review-summary">${average ? `<span class="stars" aria-hidden="true">${"★".repeat(Math.round(Number(average)))}${"☆".repeat(5 - Math.round(Number(average)))}</span> ${average} out of 5 · ${reviews.length} review${reviews.length === 1 ? "" : "s"}` : "No ratings yet"}</div>

    ${loadFailed ? '<p class="error" role="alert">Reviews could not be loaded. Refresh the page to try again.</p>' : ""}
    ${session ? `<form id="reviewForm">
      <h3>Leave a review</h3>
      <p class="hint">Posting as ${esc(session.username)}</p>
      <fieldset class="rating-picker"><legend>Your rating (required)</legend>
        <div class="star-options">${[1,2,3,4,5].map(n => `<label><input type="radio" name="rating" value="${n}" required><span aria-hidden="true">${n} ★</span><span class="hint">${n === 1 ? "star" : "stars"}</span></label>`).join("")}</div>
      </fieldset>
      <label for="reviewComment">Your comment (required)</label>
      <textarea class="input" id="reviewComment" maxlength="2000" required placeholder="Share your experience with this item or website…" aria-describedby="commentHint"></textarea>
      <p class="hint" id="commentHint">Maximum 2,000 characters.</p>
      <div class="error" id="reviewError" role="alert"></div>
      <button class="btn" type="submit">Post review</button>
    </form>` : '<p><a class="btn ghost" href="#/login">Log in to leave a review</a></p>'}
    <h3 style="margin-top:28px">Comments</h3>
    <div>${reviews.length ? reviews.map(r => `<article class="review-entry">
      <div class="review-meta"><strong>${esc(r.username)}</strong><span class="stars" aria-label="${r.rating} out of 5 stars">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</span>
      ${Number.isFinite(Date.parse(r.createdAt)) ? `<time datetime="${esc(new Date(r.createdAt).toISOString())}">${esc(new Date(r.createdAt).toLocaleDateString(undefined, {year:"numeric", month:"short", day:"numeric"}))}</time>` : ""}</div>
      <p>${esc(r.comment)}</p></article>`).join("") : '<p class="hint">No comments yet. Be the first to share your experience.</p>'}</div>`;
  const form = document.getElementById("reviewForm");
  if (form) form.addEventListener("submit", async e => {
    e.preventDefault();
    const error = document.getElementById("reviewError");
    const current = store.session();
    if (!current) { error.textContent = "Please log in before posting."; return; }
    const rating = Number(new FormData(form).get("rating"));
    const comment = document.getElementById("reviewComment").value.trim();
    if (!Number.isInteger(rating) || rating < 1 || rating > 5) { error.textContent = "Choose 1 to 5 stars."; return; }
    if (!comment || comment.length > 2000) { error.textContent = "Enter a comment between 1 and 2,000 characters."; return; }
    const submit = form.querySelector("button[type=submit]"); submit.disabled = true;
    try { await store.addReview({id: newId(), itemId, username: String(current.username), rating, comment, createdAt: new Date().toISOString()}); }
    catch (e) { error.textContent = e.message; submit.disabled = false; return; }
    await renderReviews(itemId);
    if (!host.isConnected) return;
    document.getElementById("reviewsTitle").setAttribute("tabindex", "-1");
    document.getElementById("reviewsTitle").focus();
    toast("Review posted");
  });
}

function viewLogin() { viewAccount(false); }
function viewCreateAccount() { viewAccount(true); }
function viewAccount(register) {
  $app.innerHTML = `<section class="panel"><h1>${register ? "Create account" : "Login"}</h1>
    <p class="sub">${register ? "Create your account to rate items and leave comments." : "Sign in to leave reviews or manage your listings."}</p>
    <button type="button" class="btn" id="continueLogin">${register ? "Create account" : "Continue to login"}</button>
    <p>${register ? '<a href="#/login">Already have an account? Login</a>' : '<a href="#/create-account">Create account</a>'}</p>
    <div class="error" id="loginError" role="alert"></div></section>`;
  document.getElementById("continueLogin").addEventListener("click", async e => {
    e.currentTarget.disabled = true;
    try { await startLogin(register); }
    catch (error) { document.getElementById("loginError").textContent = error.message; e.target.disabled = false; }
  });
}

function viewEdit(id) {
  if (!isAdmin()) { location.hash = "#/login"; return; }
  const isNew = id === "new";
  const cur = isNew ? { id: newId(), name: "", category: "", emoji: "📦", image: "", siteName: "", siteUrl: "https://", reason: "" }
                    : store.items().find(x => x.id === id);
  if (!cur) { location.hash = "#/"; return; }
  let image = cur.image || "";
  $app.innerHTML = `
    <form class="panel wide" id="editForm" novalidate>
      <h1>${isNew ? "Add item" : "Edit item"}</h1>
      <p class="sub">This is what visitors see on the item page.</p>
      <label for="name">Item name</label><input class="input" id="name" value="${esc(cur.name)}" required>
      <label for="cat">Category</label><input class="input" id="cat" value="${esc(cur.category)}" placeholder="Collectibles, Shoes, Electronics…">
      <label for="img">Item image</label>
      <input class="input" id="img" type="file" accept="image/*">
      <div class="hint">Optional. It is resized to fit. Without an image, an icon is shown.</div>
      <img class="preview" id="preview" alt="Preview of the chosen image">
      <label for="site">Website name</label><input class="input" id="site" value="${esc(cur.siteName)}" required>
      <label for="url">Website link</label><input class="input" id="url" type="url" value="${esc(cur.siteUrl)}" required>
      <label for="reason">Reason this site is trusted</label><textarea class="input" id="reason">${esc(cur.reason)}</textarea>
      <div class="error" id="err" role="alert"></div>
      <div class="row"><button class="btn" type="submit">Save changes</button><a class="btn ghost" href="#/">Cancel</a></div>
    </form>`;
  const prev = document.getElementById("preview");
  if (image) { prev.src = image; prev.style.display = "block"; }
  document.getElementById("img").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const max = 480, k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        image = c.toDataURL("image/jpeg", 0.65); prev.src = image; prev.style.display = "block";
      };
      im.onerror = () => { document.getElementById("err").textContent = "That file could not be read as an image."; };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  });
  document.getElementById("editForm").addEventListener("submit", async e => {
    e.preventDefault();
    const v = k => document.getElementById(k).value.trim();
    const err = document.getElementById("err");
    if (!v("name") || !v("site")) { err.textContent = "Item name and website name are required."; return; }
    if (!safeUrl(v("url"))) { err.textContent = "Enter a full website link that starts with https://"; return; }
    const updated = { ...cur, name: v("name"), category: v("cat"), siteName: v("site"), siteUrl: safeUrl(v("url")), reason: v("reason"), image };
    if (image.length > 200000) { err.textContent = "Image is too large. Choose a smaller image."; return; }
    const submit = e.currentTarget.querySelector("button[type=submit]"); submit.disabled = true;
    try {
      const result = await api(isNew ? "/items" : "/items/" + encodeURIComponent(cur.id), isNew ? "POST" : "PUT", updated);
      itemCache = itemCache.filter(x => x.id !== result.item.id).concat(result.item);
      toast(isNew ? "Item added" : "Changes saved"); location.hash = "#/item/" + result.item.id;
    } catch (error) { err.textContent = error.message; submit.disabled = false; }
  });
}

/* Reload server data on navigation; errors never fall back to demo data. */
let navigation = 0;
async function route() {
  const current = ++navigation;
  const h = location.hash.replace(/^#\/?/, "");
  const [page, arg] = h.split("/");
  renderHeader(); window.scrollTo(0, 0);
  if (page === "login") return viewLogin();
  if (page === "create-account") return viewCreateAccount();
  $app.innerHTML = '<p role="status">Loading…</p>';
  try {
    const result = await api("/items");
    if (current !== navigation) return;
    itemCache = result.items;
    if (page === "item" && arg) return viewItem(arg);
    if (page === "edit" && arg) return viewEdit(arg);
    viewHome();
  } catch (error) {
    if (current !== navigation) return;
    $app.innerHTML = `<div class="empty" role="alert">${esc(error.message)}<p><button class="btn" id="retryLoad">Retry</button></p></div>`;
    document.getElementById("retryLoad").addEventListener("click",route);
  }
}
async function boot() {
  try { await finishLogin(); }
  catch (error) { toast(error.message); }
  window.addEventListener("hashchange", route);
  route();
}
boot();
</script>

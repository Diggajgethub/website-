<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Website Finder (SWF)</title>
<meta name="description" content="Find hard-to-find and discontinued items from verified, trusted websites.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f1;
    --surface: #ffffff;
    --ink: #17212b;
    --muted: #5b6770;
    --line: #d9ddd3;
    --brand: #1d5c58;
    --brand-dark: #144542;
    --verified: #2b7a4b;
    --verified-bg: #e4f1e8;
    --warn: #a15c00;
    --warn-bg: #fbeed4;
    --danger: #a3262a;
    --focus: #0b63ce;
    --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12181d;
      --surface: #1b242b;
      --ink: #e8ecea;
      --muted: #9aa7ae;
      --line: #2e3a42;
      --brand: #5fb8b1;
      --brand-dark: #7fd0c9;
      --verified: #6fd391;
      --verified-bg: #1c3527;
      --warn: #f0b64d;
      --warn-bg: #3a2d12;
      --danger: #ff8a8d;
      --focus: #7ab4ff;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 80px; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--body); font-size: 16px; line-height: 1.55;
  }
  h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
  a { color: var(--brand); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  button, input, textarea, select { font: inherit; color: inherit; }

  /* Header */
  .topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .topbar-inner { max-width: 1100px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); margin-right: auto; }
  .brand-mark { width: 34px; height: 34px; flex: none; }
  .brand-name { font-family: var(--display); font-weight: 700; font-size: 1.25rem; }
  .brand-name small { font-family: var(--body); font-weight: 500; color: var(--muted); font-size: .8rem; margin-left: 6px; }
  .who { color: var(--muted); font-size: .9rem; }
  .role-tag { background: var(--warn-bg); color: var(--warn); border-radius: 4px; padding: 1px 7px; font-size: .8rem; font-weight: 600; margin-left: 6px; }

  /* Buttons */
  .btn { border: 1.5px solid var(--brand); background: var(--brand); color: #fff; border-radius: 8px; padding: 9px 16px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
  @media (prefers-color-scheme: dark) { .btn { color: #0c1a19; } }
  .btn.ghost { background: transparent; color: var(--brand); }
  .btn.ghost:hover { background: var(--verified-bg); }
  .btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  .btn.small { padding: 5px 11px; font-size: .88rem; }

  main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }

  /* Home hero + search */
  .hero { padding: 18px 0 8px; }
  .hero h1 { font-size: clamp(1.9rem, 4.5vw, 2.9rem); max-width: 18ch; }
  .hero p { color: var(--muted); max-width: 56ch; margin: 12px 0 0; }
  .searchbar { display: flex; gap: 8px; margin: 24px 0 8px; max-width: 680px; }
  .searchbar input { flex: 1; min-width: 0; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); }
  .searchbar input:focus { border-color: var(--brand); }
  .count { color: var(--muted); font-size: .92rem; margin: 6px 0 18px; }

  /* Grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .card-open { all: unset; cursor: pointer; display: block; }
  .card-open:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
  .thumb { aspect-ratio: 4 / 3; background: var(--verified-bg); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .ph { font-size: 3rem; }
  .seal { position: absolute; right: 8px; top: 8px; background: var(--surface); color: var(--verified); border: 1.5px solid var(--verified); border-radius: 999px; padding: 2px 9px 2px 6px; font-size: .78rem; font-weight: 600; display: flex; gap: 4px; align-items: center; }
  .card-body { padding: 12px 14px 14px; }
  .card-body h3 { font-size: 1.05rem; }
  .card-body .site { color: var(--muted); font-size: .88rem; margin-top: 3px; overflow-wrap: anywhere; }
  .card-admin { border-top: 1px solid var(--line); padding: 8px 14px; display: flex; gap: 8px; }
  .add-card { border: 2px dashed var(--brand); background: transparent; color: var(--brand); border-radius: 10px; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-weight: 600; }
  .add-card span { font-size: 2.2rem; line-height: 1; }
  .add-card:hover { background: var(--verified-bg); }
  .empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 32px; text-align: center; color: var(--muted); }

  /* Detail */
  .back { display: inline-block; margin-bottom: 16px; }
  .detail { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 28px; }
  @media (max-width: 720px) { .detail { grid-template-columns: 1fr; padding: 16px; } }
  .detail .thumb { border-radius: 10px; aspect-ratio: 1 / 1; border: 1px solid var(--line); }
  .detail h1 { font-size: clamp(1.6rem, 3.5vw, 2.2rem); }
  .field { margin-top: 18px; }
  .field .label { font-size: .85rem; color: var(--muted); margin-bottom: 2px; }
  .field .value { font-size: 1.1rem; font-weight: 600; overflow-wrap: anywhere; }
  .field .reason { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; white-space: pre-wrap; }
  .verified-line { display: inline-flex; gap: 6px; align-items: center; background: var(--verified-bg); color: var(--verified); border-radius: 6px; padding: 3px 10px; font-size: .88rem; font-weight: 600; margin-top: 10px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; }
  .notice { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 14px; font-size: .92rem; margin-top: 18px; }

  /* Forms */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 26px; max-width: 480px; margin: 20px auto; }
  .panel.wide { max-width: 720px; }
  .panel h1 { font-size: 1.7rem; margin-bottom: 6px; }
  .panel p.sub { color: var(--muted); margin: 0 0 18px; }
  label { display: block; font-weight: 600; font-size: .92rem; margin: 14px 0 4px; }
  .input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--bg); }
  .input:focus { border-color: var(--brand); }
  textarea.input { min-height: 110px; resize: vertical; }
  .hint { color: var(--muted); font-size: .85rem; margin-top: 4px; }
  .error { color: var(--danger); font-size: .92rem; margin-top: 12px; min-height: 1.2em; }
  .row { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .preview { margin-top: 10px; max-width: 180px; border-radius: 8px; border: 1px solid var(--line); display: none; }

  footer { max-width: 1100px; margin: 0 auto; padding: 0 20px 40px; color: var(--muted); font-size: .85rem; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 8px; font-weight: 500; z-index: 20; }
  @media (prefers-reduced-motion: no-preference) { .toast { animation: pop .18s ease-out; } @keyframes pop { from { opacity: 0; transform: translate(-50%, 8px); } } }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/" aria-label="Secure Website Finder home">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M20 3 33 8v10c0 9-5.6 16.2-13 19C12.6 34.2 7 27 7 18V8z" fill="var(--brand)"/>
        <path d="m13.5 19.5 4.6 4.6 8.6-9.2" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">Secure Website Finder<small>SWF</small></span>
    </a>
    <span class="who" id="who"></span>
    <button class="btn ghost" id="authBtn" type="button">Login</button>
  </div>
</header>

<main id="app"></main>
<footer>SWF lists websites we have checked. Always review a site yourself before you pay.</footer>
<div id="toastHost" aria-live="polite"></div>

<script>
/* ============================================================
   SWF - Secure Website Finder
   Static site: works from an S3 bucket with static website hosting.
   Data layer is in `store` below. Swap its methods for fetch() calls
   to API Gateway + Lambda + DynamoDB when you're ready for a real backend.
   ============================================================ */

/* ---- DEMO LOGIN (client-side only, NOT real security) ---- */
const DEMO_ADMIN = { username: "admin", password: "admin123" };

/* ---- Seed data. Links use www.google.com placeholders: replace with real verified sites. ---- */
const SEED_ITEMS = [
  { id: "i1", name: "Base Set Charizard (1st Edition)", category: "Collectibles", emoji: "🃏", image: "",
    siteName: "google Card Vault", siteUrl: "https://www.google.com/card-vault",
    reason: "Sample entry. Seller shows graded-card certificate numbers, has a published return policy, and uses HTTPS checkout through a major payment processor." },
  { id: "i2", name: "Discontinued Retro Sneakers", category: "Shoes", emoji: "👟", image: "",
    siteName: "google Sole Archive", siteUrl: "https://www.google.com/sole-archive",
    reason: "Sample entry. Authentication guarantee on every pair and a business address that checks out." },
  { id: "i3", name: "Vintage Game Console", category: "Electronics", emoji: "🎮", image: "",
    siteName: "google Retro Tech", siteUrl: "https://www.google.com/retro-tech",
    reason: "Sample entry. Items are tested before listing and buyers get a 30-day return window." },
  { id: "i4", name: "Mid-century Armchair", category: "Furniture", emoji: "🪑", image: "",
    siteName: "google Furniture Finds", siteUrl: "https://www.google.com/furniture-finds",
    reason: "Sample entry. Verified seller with long-running history and clear shipping terms." },
  { id: "i5", name: "Out-of-print Snack Box", category: "Food", emoji: "🍬", image: "",
    siteName: "google Candy Crate", siteUrl: "https://www.google.com/candy-crate",
    reason: "Sample entry. Lists expiration dates and has a verified business registration." },
  { id: "i6", name: "Limited Run Hoodie", category: "Clothes", emoji: "🧥", image: "",
    siteName: "google Threads", siteUrl: "https://www.google.com/threads",
    reason: "Sample entry. Official reseller with a secure checkout and tracked shipping." }
];

/* ---- Storage layer (swap for API calls later) ---- */
const store = {
  KEY: "swf_items_v1", SESSION: "swf_session_v1",
  items() {
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return SEED_ITEMS.map(x => ({ ...x }));
  },
  saveItems(list) { try { localStorage.setItem(this.KEY, JSON.stringify(list)); } catch (e) { toast("Could not save: storage is full or blocked."); } },
  session() { try { return JSON.parse(localStorage.getItem(this.SESSION)) || null; } catch (e) { return null; } },
  setSession(s) { try { s ? localStorage.setItem(this.SESSION, JSON.stringify(s)) : localStorage.removeItem(this.SESSION); } catch (e) {} },
  resetDemo() { try { localStorage.removeItem(this.KEY); } catch (e) {} }
};

/* ---- Helpers ---- */
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isAdmin = () => (store.session() || {}).role === "admin";
function safeUrl(u) {
  try { const x = new URL(u); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : ""; } catch (e) { return ""; }
}
function toast(msg) {
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg;
  document.getElementById("toastHost").appendChild(el); setTimeout(() => el.remove(), 2600);
}
const SEAL = '<svg width="14" height="14" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="currentColor"/><path d="m5.8 10.3 3 3 5.4-6" fill="none" stroke="var(--surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function thumb(item, seal) {
  const img = safeUrl(item.image) || (item.image || "").startsWith("data:image/") ? item.image : "";
  const inner = img ? `<img src="${esc(img)}" alt="${esc(item.name)}">` : `<span class="ph" aria-hidden="true">${esc(item.emoji || "📦")}</span>`;
  return `<div class="thumb">${inner}${seal ? `<span class="seal">${SEAL} Verified</span>` : ""}</div>`;
}
function newId() { return "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* ---- Header ---- */
function renderHeader() {
  const s = store.session();
  document.getElementById("who").innerHTML = s ? `${esc(s.username)}${s.role === "admin" ? '<span class="role-tag">Admin</span>' : ""}` : "";
  document.getElementById("authBtn").textContent = s ? "Logout" : "Login";
}
document.getElementById("authBtn").addEventListener("click", () => {
  if (store.session()) { store.setSession(null); renderHeader(); toast("Logged out"); location.hash = "#/"; route(); }
  else location.hash = "#/login";
});

/* ---- Views ---- */
let query = "";

function viewHome() {
  const admin = isAdmin();
  $app.innerHTML = `
    <section class="hero">
      <h1>Find the item. Skip the scam.</h1>
      <p>Search for hard-to-find or discontinued items. Every site in our database has been checked, so you can buy without guessing who to trust.</p>
      <form class="searchbar" role="search" id="searchForm">
        <input id="q" type="search" placeholder="Search for an item, like “Charizard”" aria-label="Search items" value="${esc(query)}">
        <button class="btn" type="submit">Search</button>
      </form>
      <div class="count" id="count"></div>
    </section>
    <section class="grid" id="grid" aria-label="Items"></section>`;
  document.getElementById("searchForm").addEventListener("submit", e => {
    e.preventDefault(); query = document.getElementById("q").value.trim(); drawGrid();
  });
  drawGrid();
}

function drawGrid() {
  const admin = isAdmin();
  const q = query.toLowerCase();
  const all = store.items();
  const list = !q ? all : all.filter(i => [i.name, i.category, i.siteName, i.reason].some(f => (f || "").toLowerCase().includes(q)));
  document.getElementById("count").textContent = q
    ? `${list.length} result${list.length === 1 ? "" : "s"} for “${query}”`
    : `${all.length} verified listing${all.length === 1 ? "" : "s"}`;
  const grid = document.getElementById("grid");
  if (!list.length && !admin) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><strong>No match yet.</strong><br>That item isn't in our database. Try a different name or a broader word.</div>`;
    return;
  }
  grid.innerHTML = list.map(i => `
    <article class="card">
      <a class="card-open" href="#/item/${esc(i.id)}" aria-label="Open ${esc(i.name)}">
        ${thumb(i, true)}
        <div class="card-body"><h3>${esc(i.name)}</h3><div class="site">${esc(i.siteName)}</div></div>
      </a>
      ${admin ? `<div class="card-admin"><a class="btn ghost small" href="#/edit/${esc(i.id)}">Edit</a><button class="btn danger small" data-del="${esc(i.id)}" type="button">Delete</button></div>` : ""}
    </article>`).join("") +
    (admin ? `<a class="add-card" href="#/edit/new"><span>+</span>Add item</a>` : "");
  grid.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    const item = store.items().find(x => x.id === b.dataset.del);
    if (item && confirm(`Delete “${item.name}”?`)) {
      store.saveItems(store.items().filter(x => x.id !== item.id)); toast("Item deleted"); drawGrid();
    }
  }));
}

function viewItem(id) {
  const i = store.items().find(x => x.id === id);
  if (!i) { $app.innerHTML = `<div class="empty">That item no longer exists. <a href="#/">Back to search</a></div>`; return; }
  const url = safeUrl(i.siteUrl);
  $app.innerHTML = `
    <a class="back" href="#/">← Back to search</a>
    <article class="detail">
      ${thumb(i, false)}
      <div>
        <h1>${esc(i.name)}</h1>
        <div class="verified-line">${SEAL} Verified website</div>
        <div class="field"><div class="label">Website name</div><div class="value">${esc(i.siteName)}</div></div>
        <div class="field"><div class="label">Website link</div>
          <div class="value">${url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer nofollow">${esc(url)}</a>` : "No link available"}</div></div>
        <div class="field"><div class="label">Why we trust it</div><div class="reason">${esc(i.reason)}</div></div>
        <div class="actions">
          ${url ? `<a class="btn" href="${esc(url)}" target="_blank" rel="noopener noreferrer nofollow">Visit website</a>` : ""}
          ${isAdmin() ? `<a class="btn ghost" href="#/edit/${esc(i.id)}">Edit this page</a>` : ""}
        </div>
      </div>
    </article>`;
}

function viewLogin() {
  $app.innerHTML = `
    <form class="panel" id="loginForm" novalidate>
      <h1>Login</h1>
      <p class="sub">Log in to your account. Admins can change the listings.</p>
      <label for="u">Username</label>
      <input class="input" id="u" autocomplete="username" required>
      <label for="p">Password</label>
      <input class="input" id="p" type="password" autocomplete="current-password" required>
      <div class="error" id="err" role="alert"></div>
      <div class="row"><button class="btn" type="submit">Login</button><a class="btn ghost" href="#/">Cancel</a></div>
      <div class="notice">Demo mode: use <b>admin</b> / <b>admin123</b> for admin. Any other username signs in as a regular user.</div>
    </form>`;
  document.getElementById("loginForm").addEventListener("submit", e => {
    e.preventDefault();
    const u = document.getElementById("u").value.trim(), p = document.getElementById("p").value;
    const err = document.getElementById("err");
    if (!u || !p) { err.textContent = "Enter both a username and a password."; return; }
    if (u.toLowerCase() === DEMO_ADMIN.username) {
      if (p !== DEMO_ADMIN.password) { err.textContent = "That password is not correct for this admin account."; return; }
      store.setSession({ username: u, role: "admin" });
    } else store.setSession({ username: u, role: "user" });
    renderHeader(); toast("Welcome, " + u); location.hash = "#/";
  });
}

function viewEdit(id) {
  if (!isAdmin()) { location.hash = "#/login"; return; }
  const isNew = id === "new";
  const cur = isNew ? { id: newId(), name: "", category: "", emoji: "📦", image: "", siteName: "", siteUrl: "https://", reason: "" }
                    : store.items().find(x => x.id === id);
  if (!cur) { location.hash = "#/"; return; }
  let image = cur.image || "";
  $app.innerHTML = `
    <form class="panel wide" id="editForm" novalidate>
      <h1>${isNew ? "Add item" : "Edit item"}</h1>
      <p class="sub">This is what visitors see on the item page.</p>
      <label for="name">Item name</label><input class="input" id="name" value="${esc(cur.name)}" required>
      <label for="cat">Category</label><input class="input" id="cat" value="${esc(cur.category)}" placeholder="Collectibles, Shoes, Electronics…">
      <label for="img">Item image</label>
      <input class="input" id="img" type="file" accept="image/*">
      <div class="hint">Optional. It is resized to fit. Without an image, an icon is shown.</div>
      <img class="preview" id="preview" alt="Preview of the chosen image">
      <label for="site">Website name</label><input class="input" id="site" value="${esc(cur.siteName)}" required>
      <label for="url">Website link</label><input class="input" id="url" type="url" value="${esc(cur.siteUrl)}" required>
      <label for="reason">Reason this site is trusted</label><textarea class="input" id="reason">${esc(cur.reason)}</textarea>
      <div class="error" id="err" role="alert"></div>
      <div class="row"><button class="btn" type="submit">Save changes</button><a class="btn ghost" href="#/">Cancel</a></div>
    </form>`;
  const prev = document.getElementById("preview");
  if (image) { prev.src = image; prev.style.display = "block"; }
  document.getElementById("img").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const max = 640, k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        image = c.toDataURL("image/jpeg", 0.82); prev.src = image; prev.style.display = "block";
      };
      im.onerror = () => { document.getElementById("err").textContent = "That file could not be read as an image."; };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  });
  document.getElementById("editForm").addEventListener("submit", e => {
    e.preventDefault();
    const v = k => document.getElementById(k).value.trim();
    const err = document.getElementById("err");
    if (!v("name") || !v("site")) { err.textContent = "Item name and website name are required."; return; }
    if (!safeUrl(v("url"))) { err.textContent = "Enter a full website link that starts with https://"; return; }
    const updated = { ...cur, name: v("name"), category: v("cat"), siteName: v("site"), siteUrl: safeUrl(v("url")), reason: v("reason"), image };
    const list = store.items();
    const idx = list.findIndex(x => x.id === updated.id);
    idx >= 0 ? list[idx] = updated : list.push(updated);
    store.saveItems(list); toast(isNew ? "Item added" : "Changes saved"); location.hash = "#/item/" + updated.id;
  });
}

/* ---- Router (hash-based, so S3 needs no redirect rules) ---- */
function route() {
  const h = location.hash.replace(/^#\/?/, "");
  const [page, arg] = h.split("/");
  renderHeader(); window.scrollTo(0, 0);
  if (page === "login") return viewLogin();
  if (page === "item" && arg) return viewItem(arg);
  if (page === "edit" && arg) return viewEdit(arg);
  viewHome();
}
window.addEventListener("hashchange", route);
route();
</script>
